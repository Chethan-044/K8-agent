###############################################################################
# Backend Service
###############################################################################
apiVersion: v1
kind: Service
metadata:
  name: k8s-agent-backend
  namespace: k8s-agent
  labels:
    app.kubernetes.io/name: k8s-agent
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: k8s-agent
    app.kubernetes.io/component: backend
  ports:
    - name: http
      protocol: TCP
      port: 3001
      targetPort: 3001
---
###############################################################################
# Frontend Service
###############################################################################
apiVersion: v1
kind: Service
metadata:
  name: k8s-agent-frontend
  namespace: k8s-agent
  labels:
    app.kubernetes.io/name: k8s-agent
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: k8s-agent
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      protocol: TCP
      port: 5173
      targetPort: 5173
