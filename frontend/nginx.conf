server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy API calls to the backend service inside the cluster.
    # This makes port-forwarding to just the frontend service work for
    # both static assets and API requests — no Gateway/Ingress needed.
    location /api/ {
        proxy_pass         http://k8s-agent-backend.k8s-agent.svc.cluster.local:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Increase timeouts for AI analysis endpoints that may take longer
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # SPA fallback — serve index.html for all non-file routes
    # so React Router handles client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Disable caching for index.html (so new deployments are picked up)
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
